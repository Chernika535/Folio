<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf6f0"><meta name="description" content="Folio — твоя библиотека журналов"><link rel="manifest" href="./manifest.webmanifest"><title>Folio — журналы и статьи</title>
<style>
:root{--paper:#faf6f0;--ink:#161616;--muted:#77736e;--line:#e5ded5;--accent:#9d674a}*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:rgba(250,246,240,.96);backdrop-filter:blur(10px);padding:16px 18px 10px;border-bottom:1px solid var(--line)}.head{display:flex;align-items:center;justify-content:space-between}.logo{font:700 32px/1 Georgia,serif;letter-spacing:-2px}.sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}main{max-width:720px;margin:auto;padding:20px 18px 100px}.title{font:normal 34px/1.09 Georgia,serif;letter-spacing:-.8px;margin:8px 0 18px}.h2{font:normal 26px/1.15 Georgia,serif;margin:22px 0 12px}.muted{color:var(--muted)}.tiny{font-size:12px}.toolbar{display:flex;gap:7px;overflow:auto;padding:5px 0 16px;scrollbar-width:none}.pill{border:1px solid var(--line);background:transparent;border-radius:30px;padding:8px 13px;white-space:nowrap}.pill.active,.primary{background:var(--ink);color:white;border-color:var(--ink)}.card{padding:19px 0;border-bottom:1px solid var(--line)}.card h3{font:normal 24px/1.2 Georgia,serif;margin:9px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.cover{width:82px;height:108px;border-radius:2px;display:flex;align-items:end;padding:10px;color:white;font:700 17px/1.1 Georgia,serif;flex-shrink:0;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.mag{border:1px solid var(--line);background:#fff;padding:12px;border-radius:8px;min-width:0}.mag .cover{width:100%;height:170px;margin-bottom:10px}.mag strong{display:block;font-size:15px}.mag button{margin-top:8px}.button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px}.button.dark{background:var(--ink);color:white}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:white;outline-color:var(--accent)}.status{font-size:12px;color:#655f59;display:inline-flex;gap:5px;align-items:center}.hero{background:#e9ded2;min-height:205px;display:flex;align-items:end;padding:20px;margin:8px 0 15px}.hero span{font:normal 38px/1 Georgia,serif;color:#423329;max-width:80%}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:rgba(250,246,240,.97);border-top:1px solid var(--line);padding:9px 2px max(12px,env(safe-area-inset-bottom));z-index:6}.nav{border:0;background:transparent;color:#7e7972;display:grid;justify-items:center;gap:2px;font-size:11px;min-width:60px}.nav b{font-size:21px;font-weight:400}.nav.active{color:var(--ink);font-weight:700}.reader{background:#fff;min-height:100vh;margin:-20px -18px -100px;padding:20px 22px 110px}.reader h1{font:normal 40px/1.12 Georgia,serif}.reader p{font:19px/1.7 Georgia,serif}.reader .meta{font:12px/1.5 system-ui;color:var(--muted)}.notice{background:#f0e9e1;border-radius:10px;padding:15px;margin:15px 0}.empty{padding:35px 8px;text-align:center;color:var(--muted)}.link{color:var(--accent);text-decoration:none}.stack{display:grid;gap:10px}.small{font-size:13px}.spaced{margin:20px 0}.hide{display:none!important}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.mag .cover{height:200px}.bottom{max-width:720px;left:50%;transform:translateX(-50%)}}
</style></head><body><header><div class="head"><div><div class="logo">Folio.</div><div class="sub">Культура · Люди · Идеи</div></div><button class="button" id="install" hidden>Установить</button></div></header><main id="app"></main><nav class="bottom" id="nav"></nav>
<script>
const foreign=[["The New Yorker","newyorker.com","Культура"],["The Atlantic","theatlantic.com","Общество"],["New York Magazine","nymag.com","Культура"],["Monocle","monocle.com","Стиль жизни"],["Kinfolk","kinfolk.com","Стиль жизни"],["Dazed","dazeddigital.com","Молодёжная культура"],["i-D","i-d.co","Молодёжная культура"],["The Face","theface.com","Архив"],["PAPER","papermag.com","Молодёжная культура"],["032c","032c.com","Искусство"],["Vanity Fair","vanityfair.com","Люди"],["Interview Magazine","interviewmagazine.com","Люди"],["Rolling Stone","rollingstone.com","Музыка"],["Vulture","vulture.com","Кино"],["Variety","variety.com","Кино"],["The Hollywood Reporter","hollywoodreporter.com","Кино"],["GQ","gq.com","Стиль жизни"],["W Magazine","wmagazine.com","Мода"],["WIRED","wired.com","Технологии"],["MIT Technology Review","technologyreview.com","Технологии"],["The Cut","thecut.com","Общество"],["Bustle","bustle.com","Стиль жизни"],["Refinery29","refinery29.com","Стиль жизни"],["The New Humanitarian","thenewhumanitarian.org","Общество"],["Psyche","psyche.co","Психология"],["Aeon","aeon.co","Идеи"],["AnOther Magazine","anothermag.com","Искусство"],["Frieze","frieze.com","Искусство"],["Wallpaper*","wallpaper.com","Дизайн"],["Elephant","elephant.art","Искусство"],["Apartamento","apartamentomagazine.com","Дизайн"],["Fantastic Man","fantasticman.com","Люди"],["The Gentlewoman","thegentlewoman.co.uk","Люди"],["A Rabbit's Foot","a-rabbitsfoot.com","Кино"],["Buffalo Zine","buffalozine.com","Мода"],["NOWNESS","nowness.com","Видео"],["Highsnobiety","highsnobiety.com","Молодёжная культура"],["Hypebeast","hypebeast.com","Молодёжная культура"]];
const russian=[["Правила жизни","pravilamag.ru","Культура"],["Сноб","snob.ru","Общество"],["Афиша Daily","daily.afisha.ru","Культура"],["Большой город","bg.ru","Культура"],["Теории и практики","theoryandpractice.ru","Идеи"],["Нож","knife.media","Идеи"],["The Blueprint","theblueprint.ru","Мода"],["SRSLY","srsly.ru","Молодёжная культура"],["Москвичка","moskvichka.ru","Стиль жизни"],["PEOPLETALK","peopletalk.ru","Люди"],["Super","super.ru","Люди"],["Жиза","zhiza.evotor.ru","Общество"],["РБК Стиль","style.rbc.ru","Стиль жизни"],["HELLO! Россия","hellomagrussia.ru","Люди"],["OK! Россия","ok-magazine.ru","Люди"],["VOICE","thevoicemag.ru","Стиль жизни"],["Marie Claire Россия","marieclaire.ru","Стиль жизни"],["Собака.ru","sobaka.ru","Культура"],["Искусство кино","kinoart.ru","Кино"],["Сеанс","seance.ru","Кино"],["Артгид","artguide.com","Искусство"],["Артхроника","artchronika.ru","Архив"],["Горький","gorky.media","Архив"],["BURO.","buro247.ru","Мода"],["Такие дела","takiedela.ru","Общество"],["Мел","mel.fm","Общество"],["Холод","holod.media","Общество"],["Батенька, да вы трансформер","batenka.ru","Архив"],["Reminder","reminder.media","Психология"],["Инде","inde.io","Культура"],["The Symbol","thesymbol.ru","Мода"],["AD Magazine Россия","admagazine.ru","Архив"],["Design Mate","design-mate.ru","Дизайн"]];
const colors=["#564d47","#7b665b","#a17762","#495d5e","#786b79","#6f7965","#937c5f"];
const mags=[...foreign.map(x=>({...{name:x[0],site:x[1],cat:x[2]},country:"Зарубежные"})),...russian.map(x=>({name:x[0],site:x[1],cat:x[2],country:"Российские"}))];
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
let followed=load("folio_followed",[]),saved=load("folio_saved",[]),extras=load("folio_extras",[]),tab="feed",mode=load("folio_mode","magazine"),country="Все",term="",fullOnly=false,reader=null,magOpen=null,lang="ru";
const all=()=>[...mags,...extras];
const demo=[{id:"a",mag:"The Blueprint",title:"Новые голоса современной культуры",en:"New Voices in Contemporary Culture",desc:"Демонстрационный материал о том, как меняются творческие сообщества.",body:"Современная культура рождается на пересечении разных дисциплин. Музыка, дизайн, кино и цифровые сообщества всё чаще формируют единый язык.\n\nВ Folio мы хотим дать читателю возможность исследовать эти идеи в удобном журнальном формате.",enbody:"Contemporary culture emerges at the intersection of different disciplines. Music, design, cinema, and digital communities increasingly shape a shared language.\n\nFolio aims to offer a beautiful magazine reading experience.",full:true},{id:"b",mag:"Dazed",title:"Кто формирует культурную повестку нового поколения",en:"Who Shapes the Culture of a New Generation",desc:"Пример карточки материала, доступного по подписке издателя.",full:false,paid:true},{id:"c",mag:"Афиша Daily",title:"Город как пространство новых идей",en:"The City as a Space for New Ideas",desc:"Демонстрационный текст о современной городской культуре.",body:"Города становятся пространствами, где встречаются разные культурные практики. Небольшие сообщества и независимые проекты способны менять привычные представления о повседневности.\n\nЭтот текст создан исключительно для демонстрации приложения Folio.",enbody:"Cities bring together different cultural practices. Independent communities and projects can change everyday life.\n\nThis text is a demonstration only.",full:true},{id:"d",mag:"The Atlantic",title:"Как технологии меняют наши привычки",en:"How Technology Changes Our Habits",desc:"Пример анонса без доступа к полному тексту.",full:false,paid:false},{id:"e",mag:"Артгид",title:"Искусство за пределами музея",en:"Art Beyond the Museum",desc:"Демонстрационная история о визуальной культуре.",body:"Искусство давно вышло за пределы музеев и галерей. Сегодня оно существует в городской среде, цифровых пространствах и повседневной жизни.\n\nМатериал не является публикацией издания «Артгид».",enbody:"Art now exists beyond museums and galleries, in urban spaces and digital life.\n\nThis is not an Artguide publication.",full:true}];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const persist=()=>{localStorage.setItem("folio_followed",JSON.stringify(followed));localStorage.setItem("folio_saved",JSON.stringify(saved));localStorage.setItem("folio_extras",JSON.stringify(extras));localStorage.setItem("folio_mode",JSON.stringify(mode))};
function cover(m){const idx=all().findIndex(x=>x.site===m.site);return '<div class="cover" style="background:'+colors[(idx+colors.length)%colors.length]+'">'+esc(m.name)+'</div>'}
function status(a){return a.full?'<span class="status">📖 Полный текст</span>':a.paid?'<span class="status">＄ Подписка издателя</span>':'<span class="status">☹ Только анонс</span>'}
function article(a){return '<article class="card" data-open="'+a.id+'"><div class="row"><span class="tiny muted">'+esc(a.mag)+'</span>'+status(a)+'</div><h3>'+esc(a.title)+'</h3><div class="muted small">'+esc(a.desc)+'</div><div class="row spaced"><span class="tiny muted">Демонстрация</span><button class="button" data-save="'+a.id+'">'+(saved.includes(a.id)?"★ Сохранено":"☆ Сохранить")+'</button></div></article>'}
function magazine(m){return '<div class="mag">'+cover(m)+'<strong>'+esc(m.name)+'</strong><div class="tiny muted">'+esc(m.cat)+'</div><div class="row"><button class="button" data-mag="'+esc(m.site)+'">Открыть</button><button class="button" data-follow="'+esc(m.site)+'">'+(followed.includes(m.site)?"✓":"＋")+'</button></div></div>'}
function render(){const app=document.getElementById("app");let s="";
if(reader){const a=demo.find(x=>x.id===reader);s='<section class="reader"><button class="button" data-back>← Назад</button><div class="toolbar spaced"><button class="pill '+(lang==="ru"?"active":"")+'" data-lang="ru">Русский</button><button class="pill '+(lang==="en"?"active":"")+'" data-lang="en">English</button><button class="pill" data-save="'+a.id+'">'+(saved.includes(a.id)?"★ Сохранено":"☆ Сохранить")+'</button></div><div class="meta">'+esc(a.mag)+' · ДЕМОНСТРАЦИЯ</div><h1>'+esc(lang==="ru"?a.title:a.en)+'</h1><div class="notice">'+(a.full?"Это демонстрационная статья, а не материал издателя. Переключение языка показывает подготовленный пример, не автоматический перевод.":a.paid?"＄ Полная версия может требовать подписки издателя.":"☹ Полный текст недоступен в Folio.")+'</div>'+(a.full?(lang==="ru"?a.body:a.enbody).split("\n\n").map(p=>"<p>"+esc(p)+"</p>").join(""):"<p>"+esc(a.desc)+"</p>")+'<a class="link" target="_blank" rel="noopener noreferrer" href="https://'+esc(all().find(m=>m.name===a.mag)?.site||"example.com")+'">Открыть сайт издания ↗</a></section>'}
else if(magOpen){const m=all().find(x=>x.site===magOpen);s='<button class="button" data-back>← Каталог</button><div class="spaced">'+cover(m)+'</div><h1 class="title">'+esc(m.name)+'</h1><p class="muted">'+esc(m.cat)+' · '+esc(m.country)+'</p><p><a class="link" target="_blank" rel="noopener noreferrer" href="https://'+esc(m.site)+'">'+esc(m.site)+' ↗</a></p><button class="button dark" data-follow="'+esc(m.site)+'">'+(followed.includes(m.site)?"✓ Вы подписаны":"＋ Подписаться")+'</button><div class="notice">Материалы этого сайта ещё не подключены. Наличие полного текста и платного доступа проверяется отдельно.</div>'+demo.filter(a=>a.mag===m.name).map(article).join("")}
else if(tab==="feed"){let items=demo.filter(a=>(!followed.length||followed.some(s=>all().find(m=>m.site===s)?.name===a.mag))&&(!fullOnly||a.full));s='<h1 class="title">Моя лента</h1><div class="toolbar"><button class="pill '+(mode==="magazine"?"active":"")+'" data-mode="magazine">Журнал</button><button class="pill '+(mode==="stream"?"active":"")+'" data-mode="stream">Поток</button><button class="pill '+(fullOnly?"active":"")+'" data-full>Только полные</button></div><p class="tiny muted">Пока показаны примеры статей. Реальная лента источников ещё не подключена.</p>'+(mode==="magazine"&&items.length?'<div class="hero"><span>Истории, которые хочется читать</span></div>':'')+items.map(article).join("")}
else if(tab==="magazines"){let list=all().filter(m=>(country==="Все"||m.country===country)&&(!term||[m.name,m.cat,m.site].join(" ").toLowerCase().includes(term.toLowerCase())));s='<h1 class="title">Журналы</h1><input class="search" id="q" placeholder="Найти журнал или тему" value="'+esc(term)+'"><div class="toolbar">'+["Все","Российские","Зарубежные"].map(x=>'<button class="pill '+(country===x?"active":"")+'" data-country="'+x+'">'+x+'</button>').join("")+'</div><p class="tiny muted">'+list.length+' изданий в каталоге · '+followed.length+' подписок</p><div class="grid">'+list.map(magazine).join("")+'</div><h2 class="h2">Добавить сайт</h2><form id="add"><input class="search" name="site" type="url" placeholder="https://example.com" required><button class="button dark spaced" type="submit">Добавить в мой каталог</button></form><p class="tiny muted">Добавление сайта пока создаёт карточку, но не загружает его статьи.</p>'}
else if(tab==="search"){let q=term.toLowerCase(),items=demo.filter(a=>[a.title,a.en,a.mag,a.desc].join(" ").toLowerCase().includes(q)&&(!fullOnly||a.full)),ms=all().filter(m=>[m.name,m.cat].join(" ").toLowerCase().includes(q)).slice(0,15);s='<h1 class="title">Поиск</h1><input class="search" id="q" placeholder="Статья, журнал, тема..." value="'+esc(term)+'"><div class="toolbar"><button class="pill '+(fullOnly?"active":"")+'" data-full>Только полные статьи</button></div><p class="tiny muted">Поиск работает по каталогу и демонстрационным статьям. Общий архив изданий пока не индексируется.</p><h2 class="h2">Статьи</h2>'+(items.map(article).join("")||'<p class="empty">Ничего не найдено</p>')+'<h2 class="h2">Журналы</h2><div class="grid">'+ms.map(magazine).join("")+'</div>'}
else if(tab==="library"){s='<h1 class="title">Библиотека</h1><p class="muted">Сохранённые статьи</p>'+(demo.filter(a=>saved.includes(a.id)).map(article).join("")||'<div class="empty">Пока пусто. Нажмите «Сохранить» на любой статье.</div>')+'<div class="notice">Офлайн: приложение сохраняет свой интерфейс и демонстрационные материалы. Загрузка реальных статей для чтения без интернета ещё не реализована.</div>'}
app.innerHTML=s;document.getElementById("nav").innerHTML=[["feed","⌂","Лента"],["magazines","▤","Журналы"],["search","⌕","Поиск"],["library","♡","Библиотека"]].map(x=>'<button class="nav '+(tab===x[0]?"active":"")+'" data-tab="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join("");}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-mode],[data-full],[data-save],[data-follow],[data-open],[data-mag],[data-country],[data-back],[data-lang]");if(!b)return;const d=b.dataset;if(d.tab){tab=d.tab;reader=null;magOpen=null;term=""}if(d.mode)mode=d.mode;if("full"in d)fullOnly=!fullOnly;if(d.save){saved=saved.includes(d.save)?saved.filter(x=>x!==d.save):[...saved,d.save]}if(d.follow){followed=followed.includes(d.follow)?followed.filter(x=>x!==d.follow):[...followed,d.follow]}if(d.open)reader=d.open;if(d.mag)magOpen=d.mag;if(d.country)country=d.country;if("back"in d){reader=null;magOpen=null}if(d.lang)lang=d.lang;persist();render();window.scrollTo(0,0)});
document.addEventListener("input",e=>{if(e.target.id!=="q")return;const pos=e.target.selectionStart;term=e.target.value;render();const q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener("submit",e=>{if(e.target.id!=="add")return;e.preventDefault();try{const u=new URL(new FormData(e.target).get("site"));if(!["http:","https:"].includes(u.protocol))throw Error();const site=u.hostname.replace(/^www\./,"");if(all().some(m=>m.site===site)){alert("Этот сайт уже есть в каталоге");return}extras.push({name:site,site,cat:"Мой сайт",country:"Российские"});persist();render()}catch{alert("Введите корректный адрес сайта")}});
let installPrompt;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;document.getElementById("install").hidden=false});document.getElementById("install").onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById("install").hidden=true}};
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));render();
</script></body></html>
