if(wikiReading){s='<section class="reader"><button class="button" data-wikiback>← Назад</button><div class="editorial-label">Открытая библиотека / Википедия</div><h1>'+esc(wikiReading.title)+'</h1><div class="notice">Реальный материал из Википедии, лицензия CC BY-SA. Это не публикация журнала. <a class="link" target="_blank" rel="noopener noreferrer" href="https://ru.wikipedia.org/wiki/'+encodeURIComponent(wikiReading.title.replace(/ /g,"_"))+'">Источник и авторы ↗</a></div>'+(wikiReading.loading?'<p>Загрузка текста…</p>':wikiReading.body.split(/\\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join(""))+'</section>'}
else if(reader){const a=demo.find(x=>x.id===reader);s='<section class="reader"><button class="button" data-back>← Назад</button><div class="toolbar spaced"><button class="pill '+(lang==="ru"?"active":"")+'" data-lang="ru">Русский</button><button class="pill '+(lang==="en"?"active":"")+'" data-lang="en">English</button><button class="pill" data-save="'+a.id+'">'+(saved.includes(a.id)?"★ Сохранено":"☆ Сохранить")+'</button></div><div class="meta">'+esc(a.mag)+' · ДЕМОНСТРАЦИЯ</div><h1>'+esc(lang==="ru"?a.title:a.en)+'</h1><div class="notice">'+(a.full?"Это демонстрационная статья, а не материал издателя. Переключение языка показывает подготовленный пример, не автоматический перевод.":a.paid?"＄ Полная версия может требовать подписки издателя.":"☹ Полный текст недоступен в Folio.")+'</div>'+(a.full?(lang==="ru"?a.body:a.enbody).split("\n\n").map(p=>"<p>"+esc(p)+"</p>").join(""):"<p>"+esc(a.desc)+"</p>")+'<a class="link" target="_blank" rel="noopener noreferrer" href="https://'+esc(all().find(m=>m.name===a.mag)?.site||"example.com")+'">Открыть сайт издания ↗</a></section>'}
else if(magOpen){const m=all().find(x=>x.site===magOpen);s='<button class="button" data-back>← Каталог</button><div class="spaced">'+cover(m)+'</div><h1 class="title">'+esc(m.name)+'</h1><p class="muted">'+esc(m.cat)+' · '+esc(m.country)+'</p><p><a class="link" target="_blank" rel="noopener noreferrer" href="https://'+esc(m.site)+'">'+esc(m.site)+' ↗</a></p><button class="button dark" data-follow="'+esc(m.site)+'">'+(followed.includes(m.site)?"✓ Вы подписаны":"＋ Подписаться")+'</button><div class="notice">Материалы этого сайта ещё не подключены. Наличие полного текста и платного доступа проверяется отдельно.</div>'+demo.filter(a=>a.mag===m.name).map(article).join("")}
else if(tab==="feed"){s='<h1 class="title">Моя лента</h1><div class="toolbar"><button class="pill '+(mode==="magazine"?"active":"")+'" data-mode="magazine">Журнал</button><button class="pill '+(mode==="stream"?"active":"")+'" data-mode="stream">Поток</button><button class="pill" data-refresh>↻ Обновить</button></div><div class="editorial-label">Настоящие публикации / RSS</div>'+(liveState==="loading"?'<div class="notice">Загружаем свежие публикации…</div>':liveState==="unavailable"?'<div class="notice">Сейчас не удалось получить RSS-ленты через публичный сервис. Ниже можно открыть сайты журналов напрямую или читать полные открытые материалы.</div>': '<p class="tiny muted">Материалы издателей открываются на их сайтах. Полный текст внутри Folio пока не гарантируется.</p>')+(mode==="magazine"&&liveItems.length?'<div class="hero"><span>Что читают сегодня</span></div>':'')+liveItems.map(liveCard).join("")+'<h2 class="h2">Читать полностью</h2><p class="muted small">Настоящие открытые статьи, доступные внутри Folio. Это энциклопедические материалы, не журнальные публикации.</p><div class="toolbar"><button class="pill" data-wiki-topic="Современное искусство">Искусство</button><button class="pill" data-wiki-topic="Кинематограф">Кино</button><button class="pill" data-wiki-topic="Дизайн">Дизайн</button><button class="pill" data-wiki-topic="Культура">Культура</button></div><h2 class="h2">Издания</h2><div class="grid">'+all().filter(m=>["Aeon","The New Humanitarian","Афиша Daily","The Atlantic","WIRED","The Blueprint"].includes(m.name)).map(magazine).join("")+'</div>'}
else if(tab==="magazines"){let list=all().filter(m=>(country==="Все"||m.country===country)&&(!term||[m.name,m.cat,m.site].join(" ").toLowerCase().includes(term.toLowerCase())));s='<h1 class="title">Журналы</h1><input class="search" id="q" placeholder="Найти журнал или тему" value="'+esc(term)+'"><div class="toolbar">'+["Все","Российские","Зарубежные"].map(x=>'<button class="pill '+(country===x?"active":"")+'" data-country="'+x+'">'+x+'</button>').join("")+'</div><p class="tiny muted">'+list.length+' изданий в каталоге · '+followed.length+' подписок</p><div class="grid">'+list.map(magazine).join("")+'</div><h2 class="h2">Добавить сайт</h2><form id="add"><input class="search" name="site" type="url" placeholder="https://example.com" required><button class="button dark spaced" type="submit">Добавить в мой каталог</button></form><p class="tiny muted">Добавление сайта пока создаёт карточку, но не загружает его статьи.</p>'}
else if(tab==="search"){const q=term.toLowerCase();const ms=all().filter(m=>[m.name,m.cat].join(" ").toLowerCase().includes(q)).slice(0,15);const li=liveItems.filter(a=>[a.title,a.mag,a.description].join(" ").toLowerCase().includes(q));s='<h1 class="title">Поиск</h1><input class="search" id="q" placeholder="Название, тема, журнал…" value="'+esc(term)+'"><p class="tiny muted">Поиск по полученным RSS-публикациям и каталогу. Для полных открытых текстов используйте кнопку ниже.</p><button class="button dark spaced" data-wiki-search>Искать полные статьи по теме</button><h2 class="h2">Публикации журналов</h2>'+(li.length?li.map(liveCard).join(""):'<p class="empty">Нет результатов среди загруженных публикаций</p>')+(wikiLoading?'<p>Ищем открытые материалы…</p>':wikiResults.length?'<h2 class="h2">Полные открытые тексты</h2>'+wikiResults.map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><p class="small muted">'+esc(x.excerpt.slice(0,190))+'</p><button class="button" data-wiki-open="'+esc(x.title)+'">Читать полностью</button></article>').join(""):"")+'<h2 class="h2">Журналы</h2><div class="grid">'+ms.map(magazine).join("")+'</div>'}
else if(tab==="library"){s='<h1 class="title">Библиотека</h1><p class="muted">Сохранённые статьи</p>'+(demo.filter(a=>saved.includes(a.id)).map(article).join("")||'<div class="empty">Пока пусто. Нажмите «Сохранить» на любой статье.</div>')+'<div class="notice">Офлайн: приложение сохраняет свой интерфейс и демонстрационные материалы. Загрузка реальных статей для чтения без интернета ещё не реализована.</div>'}
app.innerHTML=s;document.getElementById("nav").innerHTML=[["feed","⌂","Лента"],["magazines","▤","Журналы"],["search","⌕","Поиск"],["library","♡","Библиотека"]].map(x=>'<button class="nav '+(tab===x[0]?"active":"")+'" data-tab="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join("");}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-mode],[data-full],[data-save],[data-follow],[data-open],[data-mag],[data-country],[data-back],[data-lang]");if(!b)return;const d=b.dataset;if("refresh"in d){fetchFeeds();return}if(d.wikiTopic){term=d.wikiTopic;wikiSearch(term);return}if("wikiSearch"in d){if(term.trim())wikiSearch(term.trim());else alert("Введите тему поиска");return}if(d.wikiOpen){wikiOpen(d.wikiOpen);return}if("wikiback"in d){wikiReading=null;tab="search"}if(d.tab){tab=d.tab;wikiReading=null;reader=null;magOpen=null;term=""}if(d.mode)mode=d.mode;if("full"in d)fullOnly=!fullOnly;if(d.save){saved=saved.includes(d.save)?saved.filter(x=>x!==d.save):[...saved,d.save]}if(d.follow){followed=followed.includes(d.follow)?followed.filter(x=>x!==d.follow):[...followed,d.follow]}if(d.open)reader=d.open;if(d.mag)magOpen=d.mag;if(d.country)country=d.country;if("back"in d){reader=null;magOpen=null}if(d.lang)lang=d.lang;persist();render();window.scrollTo(0,0)});
document.addEventListener("input",e=>{if(e.target.id!=="q")return;const pos=e.target.selectionStart;term=e.target.value;render();const q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener("submit",e=>{if(e.target.id!=="add")return;e.preventDefault();try{const u=new URL(new FormData(e.target).get("site"));if(!["http:","https:"].includes(u.protocol))throw Error();const site=u.hostname.replace(/^www\./,"");if(all().some(m=>m.site===site)){alert("Этот сайт уже есть в каталоге");return}extras.push({name:site,site,cat:"Мой сайт",country:"Российские"});persist();render()}catch{alert("Введите корректный адрес сайта")}});
let installPrompt;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;document.getElementById("install").hidden=false});document.getElementById("install").onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById("install").hidden=true}};
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));render();fetchFeeds();
</script></body></html>
